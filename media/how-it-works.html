<title>How it works · the explainer film</title>
<!-- The explainer of the landing page, as one self-contained page (after plan-extract's app/media/how-it-works.html):
     one timeline (seconds) drives every element from a pure function of time, so the film can be scrubbed, paused and
     restarted; no voice, no music. render.py turns it into media/how-it-works-<lang>.webm, which the landing page plays.
     The story is the workflow of the platform: a plan is exported as DWG from the author's own CAD or BIM program
     (a neutral one, no product is named), uploaded and checked against the CAD guideline; errors (red) must be fixed,
     warnings are hints (docs/anleitung-de.md); the author corrects the plan in the program, exports again, and the
     second check passes. What the checker shows follows js/validation.js and js/rules.js: rooms with an error are red,
     the score is the share of rules passed. The look is the app's (css/tokens.css, the values copied below: the page
     must open from disk); the interface texts are the app's own (locales/*.json), the captions are the film's.
     Open the file to review it: ?lang=de|fr|it|en, ?autoplay to start at once, ?paused to wait, ?nocontrols to hide the
     review bar (rendering), ?loop to repeat, ?speed=1.3 to try a faster pace. The stage is 1280 x 720 and scales to the
     window. -->

// ------------------------------------------------------------------------------------------------- play, scrub, fit
let tNow = 0, playing = true, last = performance.now();

function seek(sec) { tNow = clamp(sec, 0, TOTAL); render(tNow); scrub.value = tNow; timeEl.textContent = `${tNow.toFixed(1)} / ${TOTAL.toFixed(1)} s`;
